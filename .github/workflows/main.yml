name: Contribution quotidienne

on:
  schedule:
    - cron: '20 23 * * *'   # 00h20 heure Cameroun
  workflow_dispatch:

jobs:
  contribute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make daily commit
        run: |
          git config user.name "brayano45"
          git config user.email "brayankameni5@gmail.com"
          git commit --allow-empty -m "Daily contribution $(date +'%Y-%m-%d')"
          git push
